<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="navbar navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html">⚙️ Admin — Agro Market</a>
    <div class="navbar-nav flex-row flex-wrap gap-3">
      <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
      <a class="nav-link text-white" href="productos.html">Productos</a>
      <a class="nav-link text-white" href="pedidos.html">Pedidos</a>
      <a class="nav-link text-white" href="usuarios.html">Usuarios</a>
      <a class="nav-link text-white" href="categorias.html">Categorías</a>
      <a class="nav-link text-white" href="zonas.html">Zonas</a>
      <a class="nav-link text-white" href="../catalogo.html">Ver sitio</a>
      <a class="nav-link text-white" href="#" onclick="cerrarSesion()">Salir</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <h4 class="fw-bold text-success mb-1">Usuarios</h4>
      <p class="text-muted mb-0">Crea cuentas, asigna roles y administra el acceso.</p>
    </div>
    <button class="btn btn-success" type="button" data-bs-toggle="modal"
      data-bs-target="#modalNuevoUsuario">
      <i class="bi bi-person-plus"></i> Nuevo usuario
    </button>
  </div>
  <div id="mensaje-usuarios" class="alert d-none" role="alert"></div>
  <div class="card shadow-sm border-0">
    <div id="tabla-usuarios" class="table-responsive">
      <div class="p-4 text-center"><div class="spinner-border text-success"></div></div>
    </div>
  </div>
</main>

<div class="modal fade" id="modalNuevoUsuario" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <form id="form-nuevo-usuario">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Crear usuario</h5>
        <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal"
          aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="nuevo-nombre" class="form-label">Nombre *</label>
          <input id="nuevo-nombre" class="form-control" maxlength="80" required>
        </div>
        <div class="mb-3">
          <label for="nuevo-apellido" class="form-label">Apellido *</label>
          <input id="nuevo-apellido" class="form-control" maxlength="80" required>
        </div>
        <div class="mb-3">
          <label for="nuevo-correo" class="form-label">Correo ULEAM *</label>
          <input id="nuevo-correo" class="form-control" type="email"
            placeholder="usuario@uleam.edu.ec" required>
          <div class="form-text">Solo se aceptan cuentas @uleam.edu.ec.</div>
        </div>
        <div class="mb-3">
          <label for="nuevo-rol" class="form-label">Rol *</label>
          <select id="nuevo-rol" class="form-select" required>
            <option value="cliente">Cliente</option>
            <option value="administrador">Administrador</option>
            <option value="repartidor">Repartidor</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="nuevo-password" class="form-label">Contraseña temporal *</label>
          <input id="nuevo-password" class="form-control" type="password"
            minlength="6" autocomplete="new-password" required>
          <div class="form-text">Mínimo 6 caracteres. Compártela con el usuario por un canal seguro.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
        <button id="btn-crear-usuario" class="btn btn-success" type="submit">Crear cuenta</button>
      </div>
    </form>
  </div></div>
</div>

<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script src="../js/admin/usuarios.js"></script>
</body></html>

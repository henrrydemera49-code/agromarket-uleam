<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pedidos — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="navbar navbar-dark" style="background-color:#1B5E20">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html"> Admin — Agro Market</a>
    <div class="navbar-nav flex-row flex-wrap gap-3">
      <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
      <a class="nav-link text-white" href="productos.html">Productos</a>
      <a class="nav-link text-white" href="pedidos.html">Pedidos</a>
      <a class="nav-link text-white" href="usuarios.html">Usuarios</a>
      <a class="nav-link text-white" href="categorias.html">Categorías</a>
      <a class="nav-link text-white" href="zonas.html">Zonas</a>
      <a class="nav-link text-white" href="../catalogo.html">Ver sitio</a>
      <a class="nav-link text-white" href="#" onclick="cerrarSesion()">Salir</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  <h4 class="fw-bold text-success mb-3"> Pedidos</h4>

  <!-- Filtro por estado -->
  <div class="mb-3">
    <select id="filtro-estado" class="form-select" style="max-width:250px"
            onchange="cargarPedidos()">
      <option value="">Todos los estados</option>
      <option value="pendiente">Pendiente</option>
      <option value="confirmado">Confirmado</option>
      <option value="en_preparacion">En Preparación</option>
      <option value="en_camino">En Camino</option>
      <option value="listo_para_retirar">Listo para retirar</option>
      <option value="entregado">Entregado</option>
      <option value="cancelado">Cancelado</option>
    </select>
  </div>

  <div class="card shadow-sm border-0">
    <div id="tabla-pedidos">
      <div class="p-4 text-center"><div class="spinner-border text-success"></div></div>
    </div>
  </div>
</div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/db.js"></script>
<script>
  protegerPagina(["administrador"]);

  const colorEstado = {
    pendiente:"warning", confirmado:"info", en_preparacion:"primary",
    en_camino:"secondary", listo_para_retirar:"info",
    entregado:"success", cancelado:"danger"
  };
  let repartidoresDisponibles = [];

  async function iniciarPagina() {
    cargarNavbar();
    const tabla = document.getElementById("tabla-pedidos");
    tabla.addEventListener("click", evento => {
      const boton = evento.target.closest("[data-action='assign-driver']");
      if (boton) asignarRepartidorDesdeTabla(boton);
    });
    tabla.addEventListener("change", evento => {
      const select = evento.target.closest("[data-action='change-state']");
      if (select) actualizarEstado(select.dataset.orderId, select.value);
    });
    try {
      repartidoresDisponibles = await listarRepartidores();
      await cargarPedidos();
    } catch (error) {
      console.error("No se pudo inicializar la gestión de pedidos:", error);
      tabla.textContent = "No se pudieron cargar los pedidos.";
    }
  }

  async function cargarPedidos() {
    const el = document.getElementById("tabla-pedidos");
    try {
      const estado = document.getElementById("filtro-estado").value;
      const pedidos = await listarTodosPedidos(estado);

      if (!pedidos.length) {
        el.innerHTML = `<p class="text-center text-muted p-4">No hay pedidos.</p>`;
        return;
      }

      const nombresRepartidores = new Map(repartidoresDisponibles.map(repartidor =>
        [repartidor.id, `${repartidor.nombre || ""} ${repartidor.apellido || ""}`.trim()]
      ));
      el.innerHTML = `<table class="table mb-0 align-middle table-hover">
        <thead class="table-success">
          <tr><th>#</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Estado</th>
              <th>Fecha</th><th>Repartidor / Acción</th></tr>
        </thead>
        <tbody>
          ${pedidos.map(p => {
            const opciones = (TRANSICIONES_VALIDAS[p.estado] || []).filter(estado =>
              estado !== "en_camino"
              && (estado !== "listo_para_retirar" || p.tipo === "retiro")
            );
            const asignacion = p.tipo !== "delivery"
              ? "Retiro por cliente"
              : p.repartidor_id
                ? escaparHTML(nombresRepartidores.get(p.repartidor_id) || "Repartidor asignado")
                : p.estado === "en_preparacion"
                  ? `<div class="d-flex gap-1">
                      <select class="form-select form-select-sm" data-driver-select
                        aria-label="Seleccionar repartidor"
                        ${repartidoresDisponibles.length ? "" : "disabled"}>
                        <option value="">${repartidoresDisponibles.length
                          ? "Seleccionar"
                          : "No hay repartidores activos"}</option>
                        ${repartidoresDisponibles.map(repartidor => `
                          <option value="${escaparHTML(repartidor.id)}">
                            ${escaparHTML(`${repartidor.nombre || ""} ${repartidor.apellido || ""}`.trim())}
                          </option>`).join("")}
                      </select>
                      <button class="btn btn-success btn-sm text-nowrap" type="button"
                        data-action="assign-driver" data-order-id="${escaparHTML(p.id)}"
                        ${repartidoresDisponibles.length ? "" : "disabled"}>Asignar y enviar</button>
                    </div>`
                  : "Sin asignar";
            return `<tr>
              <td class="fw-bold small">${escaparHTML(p.id.slice(0,6).toUpperCase())}</td>
              <td><small>${escaparHTML(p.cliente_nombre || p.cliente_id?.slice(0,10) || "—")}</small></td>
              <td>${p.tipo === "delivery" ? "Delivery" : "Retiro"}</td>
              <td class="fw-bold text-success">${fmt(p.total || 0)}</td>
              <td><span class="badge bg-${colorEstado[p.estado]||"secondary"}">
                ${escaparHTML(ETIQUETAS_ESTADO[p.estado]||p.estado)}</span></td>
              <td><small>${p.created_at?.toDate?.()?.toLocaleDateString("es-EC")||"—"}</small></td>
              <td>${asignacion}
                ${opciones.length ? `<select class="form-select form-select-sm mt-1"
                  aria-label="Cambiar estado" data-action="change-state"
                  data-order-id="${escaparHTML(p.id)}">
                  <option value="">— cambiar estado —</option>
                  ${opciones.map(estado =>
                    `<option value="${estado}">${ETIQUETAS_ESTADO[estado]}</option>`
                  ).join("")}
                </select>` : ""}
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>`;
    } catch (error) {
      console.error("No se pudieron cargar los pedidos:", error);
      el.textContent = "No se pudieron cargar los pedidos.";
    }
  }

  async function asignarRepartidorDesdeTabla(boton) {
    const fila = boton.closest("tr");
    const repartidorId = fila.querySelector("[data-driver-select]").value;
    if (!repartidorId) {
      mostrarToast("Selecciona un repartidor.", "warning");
      return;
    }
    boton.disabled = true;
    try {
      await asignarPedidoARepartidor(boton.dataset.orderId, repartidorId);
      mostrarToast("Pedido asignado y enviado al repartidor ✓");
      await cargarPedidos();
    } catch (error) {
      console.error("No se pudo asignar el pedido:", error);
      mostrarToast(error.message || "No se pudo asignar el pedido.", "danger");
      boton.disabled = false;
    }
  }

  async function actualizarEstado(pedidoId, nuevoEstado) {
    if (!nuevoEstado) return;
    try {
      await cambiarEstadoPedido(pedidoId, nuevoEstado);
      mostrarToast("Estado del pedido actualizado ✓");
      await cargarPedidos();
    } catch (error) {
      mostrarToast(error.message || "No se pudo actualizar el pedido.", "danger");
      await cargarPedidos();
    }
  }

</script>
</body></html>

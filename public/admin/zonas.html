<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zonas de entrega — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="navbar navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html">⚙️ Admin — Agro Market</a>
    <div class="navbar-nav flex-row flex-wrap gap-3">
      <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
      <a class="nav-link text-white" href="productos.html">Productos</a>
      <a class="nav-link text-white" href="pedidos.html">Pedidos</a>
      <a class="nav-link text-white" href="usuarios.html">Usuarios</a>
      <a class="nav-link text-white" href="categorias.html">Categorías</a>
      <a class="nav-link text-white" href="zonas.html">Zonas</a>
      <a class="nav-link text-white" href="../catalogo.html">Ver sitio</a>
      <a class="nav-link text-white" href="#" onclick="cerrarSesion()">Salir</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  <h4 class="fw-bold text-success mb-1">Zonas de entrega</h4>
  <p class="text-muted">Configura los bloques disponibles y su tarifa de envío.</p>
  <div id="mensaje-zonas" class="alert d-none" role="alert"></div>
  <div class="row g-4">
    <section class="col-lg-4">
      <form id="form-zona" class="card shadow-sm border-0 p-3">
        <h5 id="titulo-formulario" class="fw-bold">Nueva zona</h5>
        <div class="mb-3">
          <label for="zona-nombre" class="form-label">Nombre *</label>
          <input id="zona-nombre" class="form-control" maxlength="80" required>
        </div>
        <div class="mb-3">
          <label for="zona-tarifa" class="form-label">Tarifa de envío *</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input id="zona-tarifa" class="form-control" type="number" min="0" step="0.01" required>
          </div>
        </div>
        <div class="form-check mb-3">
          <input id="zona-activa" class="form-check-input" type="checkbox" checked>
          <label for="zona-activa" class="form-check-label">Activa</label>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-success" type="submit">Guardar</button>
          <button id="cancelar-edicion" class="btn btn-outline-secondary d-none" type="button">Cancelar</button>
        </div>
      </form>
    </section>
    <section class="col-lg-8">
      <div class="card shadow-sm border-0">
        <div id="tabla-zonas" class="table-responsive">
          <div class="p-4 text-center"><div class="spinner-border text-success"></div></div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script src="../js/admin/zonas.js"></script>
</body></html>

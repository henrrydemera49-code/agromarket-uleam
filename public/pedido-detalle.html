<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detalle del pedido — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="catalogo.html">🌱 Agro Market ULEAM</a>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link text-white" href="catalogo.html">Catálogo</a>
      <a class="nav-link text-white" href="mis-pedidos.html">Mis pedidos</a>
      <span class="nav-link text-white" id="usuario-nombre"></span>
      <a class="nav-link text-white" href="#" onclick="cerrarSesion()">Salir</a>
    </div>
  </div>
</nav>
<main class="container py-4" style="max-width:900px">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h4 class="fw-bold text-success mb-0"><i class="bi bi-receipt"></i> Detalle del pedido</h4>
    <a class="btn btn-outline-success" href="mis-pedidos.html">Volver a mis pedidos</a>
  </div>
  <div id="mensaje-error" class="alert alert-danger d-none" role="alert"></div>
  <div id="detalle-pedido">
    <div class="text-center py-5"><div class="spinner-border text-success"></div></div>
  </div>
</main>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script>
  protegerPagina(["cliente", "administrador", "repartidor"]);

  function mostrarError(mensaje) {
    const el = document.getElementById("mensaje-error");
    el.textContent = mensaje;
    el.classList.remove("d-none");
    document.getElementById("detalle-pedido").textContent = "";
  }

  function fechaLegible(fecha) {
    const valor = fecha?.toDate ? fecha.toDate() : new Date(fecha);
    return Number.isNaN(valor.getTime()) ? "—" : valor.toLocaleString("es-EC");
  }

  async function iniciarPagina() {
    cargarNavbar();
    const pedidoId = new URLSearchParams(window.location.search).get("id");
    if (!pedidoId) {
      mostrarError("No se indicó el pedido que deseas consultar.");
      return;
    }
    try {
      const pedido = await obtenerPedido(pedidoId);
      if (!pedido) {
        mostrarError("No se encontró el pedido.");
        return;
      }
      renderPedido(pedido);
    } catch (error) {
      console.error("No se pudo cargar el detalle del pedido:", error);
      mostrarError("No se pudo consultar el pedido. Verifica tu acceso e inténtalo nuevamente.");
    }
  }

  function renderPedido(pedido) {
    const colores = {
      pendiente: "warning", confirmado: "info", en_preparacion: "primary",
      en_camino: "secondary", listo_para_retirar: "info",
      entregado: "success", cancelado: "danger"
    };
    const detalles = Array.isArray(pedido.detalles) ? pedido.detalles : [];
    const historial = Array.isArray(pedido.historial) ? pedido.historial : [];
    let urlComprobante = "";
    if (pedido.comprobante_url) {
      try {
        const url = new URL(pedido.comprobante_url);
        if (url.protocol === "https:") urlComprobante = url.href;
      } catch (error) {
        console.error("El enlace del comprobante no es válido:", error);
      }
    }
    document.getElementById("detalle-pedido").innerHTML = `
      <section class="card shadow-sm border-0 mb-4">
        <div class="card-body d-flex justify-content-between align-items-start flex-wrap gap-3">
          <div>
            <h5 class="fw-bold mb-1">Pedido #${escaparHTML(pedido.id.slice(0, 8).toUpperCase())}</h5>
            <small class="text-muted">${escaparHTML(fechaLegible(pedido.created_at))}</small>
          </div>
          <span class="badge fs-6 text-bg-${colores[pedido.estado] || "secondary"}">
            ${escaparHTML(ETIQUETAS_ESTADO[pedido.estado] || pedido.estado)}
          </span>
        </div>
      </section>
      <div class="row g-4">
        <section class="col-lg-7">
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
              <h5 class="fw-bold mb-3">Productos</h5>
              <div class="table-responsive"><table class="table align-middle mb-0">
                <thead class="table-success"><tr>
                  <th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th>
                </tr></thead>
                <tbody>${detalles.map(item => `
                  <tr>
                    <td>${escaparHTML(item.nombre || "Producto")}</td>
                    <td>${Number(item.cantidad || 0)}</td>
                    <td>${fmt(item.precio_unitario)}</td>
                    <td>${fmt(item.subtotal ?? Number(item.precio_unitario) * Number(item.cantidad))}</td>
                  </tr>`).join("")}</tbody>
              </table></div>
              <hr>
              <div class="d-flex justify-content-between"><span>Subtotal</span><strong>${fmt(pedido.subtotal)}</strong></div>
              <div class="d-flex justify-content-between"><span>Envío</span><strong>${fmt(pedido.tarifa_envio)}</strong></div>
              <div class="d-flex justify-content-between fs-5 text-success mt-2">
                <strong>Total</strong><strong>${fmt(pedido.total)}</strong>
              </div>
            </div>
          </div>
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="fw-bold mb-3">Historial</h5>
              ${historial.length ? `<ul class="list-group list-group-flush">
                ${historial.map(item => `
                  <li class="list-group-item px-0">
                    <div class="d-flex justify-content-between flex-wrap gap-2">
                      <strong>${escaparHTML(ETIQUETAS_ESTADO[item.estado_nuevo] || item.estado_nuevo)}</strong>
                      <small class="text-muted">${escaparHTML(fechaLegible(item.fecha))}</small>
                    </div>
                    ${item.nota ? `<small class="text-muted">${escaparHTML(item.nota)}</small>` : ""}
                  </li>`).join("")}
              </ul>` : `<p class="text-muted mb-0">Aún no hay actualizaciones.</p>`}
            </div>
          </div>
        </section>
        <aside class="col-lg-5">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="fw-bold mb-3">Entrega y pago</h5>
              <p><strong>Método:</strong> ${pedido.tipo === "delivery" ? "Delivery" : "Retiro"}</p>
              ${pedido.direccion_entrega
                ? `<p><strong>Dirección:</strong> ${escaparHTML(pedido.direccion_entrega)}</p>` : ""}
              <p><strong>Pago:</strong> ${pedido.forma_pago === "transferencia" ? "Transferencia" : "Efectivo"}</p>
              ${urlComprobante
                ? `<a class="btn btn-outline-success btn-sm mb-3" href="${escaparHTML(urlComprobante)}"
                    target="_blank" rel="noopener noreferrer">Ver comprobante</a>` : ""}
              ${pedido.notas
                ? `<p class="mb-0"><strong>Notas:</strong> ${escaparHTML(pedido.notas)}</p>` : ""}
            </div>
          </div>
        </aside>
      </div>`;
  }
</script>
</body></html>
